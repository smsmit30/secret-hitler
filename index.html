html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,'Times New Roman',serif;min-height:100vh;

h1,h2,h3,.disp{font-family:'Oswald','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}

input[type=text],input[type=password]{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 10px}

/* Boards */
.track{display:grid;gap:6px;margin-top:6px}

.slot svg,.slot img{width:78%;height:auto}
.slot.on svg,.slot.on img{width:100%;height:100%}

.boardL{border-color:var(--libd)}.boardF{border-color:var(--fasd)}
.cap{font:12px 'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px;min-height:1.2em}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dot.on{background:var(--gold)}

.tile svg,.tile img{width:100%;height:100%;display:block;object-fit:cover}

.votecards{display:flex;gap:14px;justify-content:center;margin:10px 0}
.votecards button{width:42%;max-width:190px;aspect-ratio:5/7;font-size:34px;border-radius:12px;border-width:3px;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.votecards .ja{background:var(--ok);color:#fff}.votecards .nein{background:var(--bad);color:#fff}
.votecards img{width:100%;height:100%;object-fit:cover}

/* Players */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.pl{border:2px solid var(--ink);border-radius:8px;padding:7px 9px;background:var(--bg);position:relative;text-align:left;box-shadow:none;text-transform:none;letter-spacing:0;font-family:inherit;font-size:15px}
.pl .nm{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pl .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;min-height:18px}
.tag{font:700 10px 'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 5px;border:1.5px solid var(--ink);background:var(--paper)}
.tag.p{background:var(--gold);color:#201c15}.tag.c{background:var(--lib);color:#fff}.tag.f{background:var(--fas);color:#fff}.tag.h{background:var(--hit);color:#fff}
.tag.me{background:var(--ink);color:var(--paper)}.tag.ok{background:var(--ok);color:#fff}
.pl:disabled{color:var(--ink);opacity:1;cursor:default}.pl.off:disabled{opacity:.45}.pl.dead:disabled{opacity:.5}
.pl.dead{opacity:.5}.pl.dead .nm{text-decoration:line-through}
.pl.pick{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pl.sel{background:var(--gold);color:#201c15}
.pl.off{opacity:.45}
.log{max-height:190px;overflow:auto;font-size:14px;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal .card{max-width:480px;width:100%;max-height:92vh;overflow:auto;margin:0}
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.vv{display:flex;justify-content:space-between;border:2px solid var(--ink);border-radius:6px;padding:5px 8px;font-size:14px}
.vv.ja{background:var(--ok);color:#fff}.vv.nein{background:var(--bad);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw;font-size:15px;text-align:center}
.win{font-size:28px;text-align:center;padding:14px;border-radius:10px;color:#fff;border:3px solid var(--ink)}
.win.liberal{background:var(--lib)}.win.fascist{background:var(--fas)}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.5}
.foot a{color:inherit}
.slotrow{display:flex;gap:8px;align-items:center;border-bottom:1px dotted var(--line);padding:6px 0}
.slotrow img{width:34px;height:48px;object-fit:cover;border-radius:3px;border:1px solid var(--ink)}
.slotrow .nm{flex:1;font-size:14px}
.slotrow input{display:none}
.slotrow label.btn{cursor:pointer;border:2px solid var(--ink);border-radius:6px;padding:4px 9px;color:var(--ink)}
@media (max-width:380px){h1{font-size:28px}.wrap{padding:8px 8px 40px}.card{padding:10px}button{padding:10px 12px}}
</style>

<script>
/* ===== Secret Hitler rules engine (host-authoritative, pure JS) ===== */
const SH = (() => {
  const SPLIT = { 5:[3,1], 6:[4,1], 7:[4,2], 8:[5,2], 9:[5,3], 10:[6,3] }; // [liberals, plain fascists] (+ Hitler)
  const POWERS = {
    s: [null, null, 'peek', 'execute', 'execute'],
    m: [null, 'investigate', 'special', 'execute', 'execute'],
    l: ['investigate', 'investigate', 'special', 'execute', 'execute']
  };
  const powerTrack = n => n <= 6 ? POWERS.s : n <= 8 ? POWERS.m : POWERS.l;
  const powerFor = (n, f) => powerTrack(n)[f - 1] || null;

  function shuffle(a, rnd) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const nm = (G, p) => (G.S.names[p] || 'Someone');
  const alive = S => S.seats.filter(p => !S.dead.includes(p));
  function log(G, msg) { G.S.log.unshift(msg); if (G.S.log.length > 60) G.S.log.length = 60; }
  function sync(G) { G.S.drawN = G.E.deck.length; G.S.discN = G.E.discard.length; }

  function newGame(seatIds, names, rnd) {
    rnd = rnd || Math.random;
    const n = seatIds.length;
    if (!SPLIT[n]) throw new Error('Need 5–10 players');
    const [nl, nf] = SPLIT[n];
    const seats = shuffle(seatIds, rnd);
    const rl = shuffle([...Array(nl).fill('L'), ...Array(nf).fill('F'), 'H'], rnd);
    const E = { roles: {}, deck: shuffle([...Array(6).fill('L'), ...Array(11).fill('F')], rnd),
      discard: [], hand: [], peek: null, inv: null, votes: {}, base: Math.floor(rnd() * n), rnd: 0 };
    seats.forEach((p, i) => { E.roles[p] = rl[i]; });
    const S = { phase: 'play', seats, names: Object.assign({}, names), dead: [], stage: 'nominate',
      pres: seats[E.base], nominee: null, chan: null, voted: [], tracker: 0, libs: 0, fasc: 0,
      prev: null, inel: [], inv: [], notH: [], lastVote: null, lastPolicy: null, vetoOpen: false,
      vetoDenied: false, ackKind: null, winner: null, why: '', roles: null, log: [], rev: 0,
      voteId: 0, polN: 0, drawN: 17, discN: 0, special: false, acks: {} };
    const G = { S, E, rnd };
    log(G, 'The game begins. ' + nm(G, S.pres) + ' is the first President.');
    S.inel = inelig(S);
    sync(G);
    return G;
  }

  function inelig(S) {
    const r = [S.pres];
    if (S.prev) {
      r.push(S.prev.chan);
      if (alive(S).length > 5) r.push(S.prev.pres);
    }
    return r.filter((p, i) => r.indexOf(p) === i);
  }

  function draw(G, k) {
    const { E } = G;
    if (E.deck.length < 3) {
      E.deck = shuffle(E.deck.concat(E.discard), G.rnd || Math.random);
      E.discard = [];
      log(G, 'The policy deck was reshuffled.');
    }
    return E.deck.splice(0, k);
  }

  function end(G, winner, why) {
    const { S, E } = G;
    S.phase = 'over'; S.stage = 'over'; S.winner = winner; S.why = why;
    S.roles = Object.assign({}, E.roles);
    S.nominee = S.nominee; E.hand = []; E.peek = null; E.inv = null;
    log(G, (winner === 'liberal' ? 'LIBERALS WIN — ' : 'FASCISTS WIN — ') + why + '.');
  }

  function nextRound(G, forced) {
    const { S, E } = G;
    S.chan = null; S.nominee = null; S.voted = []; E.votes = {}; E.hand = []; E.peek = null; E.inv = null;
    S.vetoOpen = false; S.vetoDenied = false; S.ackKind = null;
    if (forced) { S.pres = forced; S.special = true; }
    else {
      const n = S.seats.length; let i = E.base;
      do { i = (i + 1) % n; } while (S.dead.includes(S.seats[i]));
      E.base = i; S.pres = S.seats[i]; S.special = false;
    }
    S.stage = 'nominate';
    S.inel = inelig(S);
    log(G, nm(G, S.pres) + ' is now President' + (forced ? ' (special election).' : '.'));
  }

  function enact(G, card, chaos) {
    const { S } = G;
    if (card === 'L') S.libs++; else S.fasc++;
    S.tracker = 0;
    S.lastPolicy = { card, chaos: !!chaos, n: ++S.polN };
    log(G, 'A ' + (card === 'L' ? 'Liberal' : 'Fascist') + ' policy was enacted' + (chaos ? ' by the people.' : '.'));
    if (S.libs >= 5) return end(G, 'liberal', 'Five Liberal policies were enacted');
    if (S.fasc >= 6) return end(G, 'fascist', 'Six Fascist policies were enacted');
    if (card === 'F' && !chaos) {
      const pw = powerFor(S.seats.length, S.fasc);
      if (pw) return startPower(G, pw);
    }
    nextRound(G);
  }

  function startPower(G, pw) {
    const { S, E } = G;
    if (pw === 'peek') {
      if (E.deck.length < 3) { E.deck = shuffle(E.deck.concat(E.discard), G.rnd || Math.random); E.discard = []; log(G, 'The policy deck was reshuffled.'); }
      E.peek = E.deck.slice(0, 3); S.stage = 'ack'; S.ackKind = 'peek';
      log(G, nm(G, S.pres) + ' secretly looks at the top three policies.');
    } else {
      S.stage = pw; // investigate | special | execute
      log(G, nm(G, S.pres) + ' gains a presidential power: ' + pw + '.');
    }
  }

  function chaos(G) {
    const { S } = G;
    log(G, 'Three failed elections — the country is thrown into chaos!');
    const card = draw(G, 1)[0];
    S.prev = null;
    enact(G, card, true);
  }

  function failGov(G) {
    const { S } = G;
    S.tracker++;
    if (S.tracker >= 3) chaos(G); else nextRound(G);
  }

  function resolveVote(G) {
    const { S, E } = G;
    const votes = Object.assign({}, E.votes);
    const ja = Object.values(votes).filter(v => v === 'ja').length;
    const nein = Object.values(votes).length - ja;
    const passed = ja > nein;
    S.lastVote = { id: ++S.voteId, pres: S.pres, chan: S.nominee, votes, ja, nein, passed };
    if (passed) {
      S.chan = S.nominee;
      S.prev = { pres: S.pres, chan: S.chan };
      log(G, 'Government elected ' + ja + '–' + nein + ': ' + nm(G, S.pres) + ' (President) & ' + nm(G, S.chan) + ' (Chancellor).');
      if (S.fasc >= 3) {
        if (E.roles[S.chan] === 'H') return end(G, 'fascist', nm(G, S.chan) + ' was Hitler and was elected Chancellor');
        if (!S.notH.includes(S.chan)) S.notH.push(S.chan);
      }
      E.votes = {};
      E.hand = draw(G, 3);
      S.stage = 'pres_discard';
    } else {
      log(G, 'Government rejected ' + ja + '–' + nein + ': ' + nm(G, S.pres) + ' & ' + nm(G, S.nominee) + '. Election tracker advances.');
      E.votes = {}; S.voted = [];
      failGov(G);
    }
  }

  // returns {ok:true} or {ok:false, err}
  function act(G, pid, a) {
    const { S, E } = G;
    const bad = err => ({ ok: false, err });
    if (S.phase !== 'play') return bad('Game is not in progress');
    if (!S.seats.includes(pid)) return bad('Not a player');
    if (S.dead.includes(pid)) return bad('You are dead');
    const isAlive = p => S.seats.includes(p) && !S.dead.includes(p);
    switch (a.t) {
      case 'nominate': {
        if (S.stage !== 'nominate' || pid !== S.pres) return bad('Not your move');
        if (!isAlive(a.target) || S.inel.includes(a.target)) return bad('Ineligible');
        S.nominee = a.target; S.voted = []; E.votes = {}; S.stage = 'vote';
        log(G, nm(G, pid) + ' nominates ' + nm(G, a.target) + ' as Chancellor.');
        break;
      }
      case 'vote': {
        if (S.stage !== 'vote' || S.voted.includes(pid)) return bad('Cannot vote');
        if (a.v !== 'ja' && a.v !== 'nein') return bad('Bad vote');
        E.votes[pid] = a.v; S.voted.push(pid);
        if (S.voted.length >= alive(S).length) resolveVote(G);
        break;
      }
      case 'discard': {
        if (S.stage === 'pres_discard' && pid === S.pres) {
          if (!(a.i >= 0 && a.i < E.hand.length)) return bad('Bad card');
          E.discard.push(E.hand.splice(a.i, 1)[0]);
          S.stage = 'chan_discard'; S.vetoOpen = S.fasc >= 5; S.vetoDenied = false;
          log(G, nm(G, pid) + ' passes two policies to ' + nm(G, S.chan) + '.');
        } else if (S.stage === 'chan_discard' && pid === S.chan) {
          if (!(a.i >= 0 && a.i < E.hand.length)) return bad('Bad card');
          E.discard.push(E.hand.splice(a.i, 1)[0]);
          const card = E.hand.splice(0, 1)[0];
          enact(G, card, false);
        } else return bad('Not your move');
        break;
      }
      case 'veto': {
        if (S.stage !== 'chan_discard' || pid !== S.chan || !S.vetoOpen || S.vetoDenied) return bad('No veto');
        S.stage = 'veto';
        log(G, nm(G, pid) + ' proposes a veto.');
        break;
      }
      case 'vetoResp': {
        if (S.stage !== 'veto' || pid !== S.pres) return bad('Not your move');
        if (a.ok) {
          E.discard.push(...E.hand); E.hand = [];
          log(G, 'The veto was accepted. Both policies are discarded.');
          failGov(G);
        } else {
          S.vetoDenied = true; S.stage = 'chan_discard';
          log(G, nm(G, pid) + ' refuses the veto.');
        }
        break;
      }
      case 'ack': {
        if (S.stage !== 'ack' || pid !== S.pres) return bad('Not your move');

const BOT_NAMES = ['Ada', 'Brutus', 'Clara', 'Dmitri', 'Edith', 'Franz', 'Greta', 'Hugo', 'Ilse', 'Jonas'];
async function addBot() {
  const bots = Object.entries(ST.players).filter(([, d]) => d.bot);
  if (Object.keys(ST.players).length >= 10) return toast('The table is full (10).');
  const used = new Set(Object.values(ST.players).map(d => d.name));
  const nm = 'Bot ' + (BOT_NAMES.find(n => !used.has('Bot ' + n)) || (bots.length + 1));
  const id = 'bot_' + Math.random().toString(36).slice(2, 8);
  try { await DB.doc('games/' + ST.gid + '/players/' + id).set({ name: nm, pub: 'bot', bot: true, t: Date.now() }); }
  catch (e) { toast('Could not add bot: ' + (e && e.message || e)); }
}
async function removeBot() {
  const bots = Object.entries(ST.players).filter(([, d]) => d.bot).sort((a, b) => b[1].t - a[1].t);
  if (!bots.length) return;
  try { await DB.doc('games/' + ST.gid + '/players/' + bots[0][0]).delete(); } catch (e) {}
}
function botAction(G) {
  const S = G.S, E = G.E;
  if (S.phase !== 'play') return null;
  const isBot = p => !!(ST.players[p] && ST.players[p].bot);
  const alive = SH.alive(S), role = p => E.roles[p], pickOne = a => a[Math.floor(Math.random() * a.length)];
  const fas = p => role(p) === 'F' || role(p) === 'H';
  switch (S.stage) {
    case 'nominate':
      if (isBot(S.pres)) return { pid: S.pres, a: { t: 'nominate', target: pickOne(alive.filter(p => !S.inel.includes(p))) } };
      break;
    case 'vote': {
      const b = alive.find(p => isBot(p) && !S.voted.includes(p));
      if (b) { const ja = fas(b) ? (fas(S.nominee) || Math.random() < .6) : Math.random() < .7; return { pid: b, a: { t: 'vote', v: ja ? 'ja' : 'nein' } }; }
      break;
    }
    case 'pres_discard':
      if (isBot(S.pres)) { let i = E.hand.indexOf(fas(S.pres) ? 'L' : 'F'); if (i < 0) i = 0; return { pid: S.pres, a: { t: 'discard', i } }; }
      break;
    case 'chan_discard':
      if (isBot(S.chan)) {
        if (S.vetoOpen && !S.vetoDenied && !fas(S.chan) && E.hand.every(c => c === 'F')) return { pid: S.chan, a: { t: 'veto' } };
        let keep = E.hand.indexOf(fas(S.chan) ? 'F' : 'L'); if (keep < 0) keep = 0;
        return { pid: S.chan, a: { t: 'discard', i: 1 - keep } };
      }
      break;
    case 'veto':
      if (isBot(S.pres)) return { pid: S.pres, a: { t: 'vetoResp', ok: !fas(S.pres) } };
      break;
    case 'ack':
      if (isBot(S.pres)) return { pid: S.pres, a: { t: 'ack' } };
      break;
    case 'investigate':
      if (isBot(S.pres)) return { pid: S.pres, a: { t: 'investigate', target: pickOne(alive.filter(p => p !== S.pres && !S.inv.includes(p))) } };
      break;
    case 'special':
      if (isBot(S.pres)) return { pid: S.pres, a: { t: 'special', target: pickOne(alive.filter(p => p !== S.pres)) } };
      break;
    case 'execute':
      if (isBot(S.pres)) {
        let c = alive.filter(p => p !== S.pres);
        if (fas(S.pres)) { const nf = c.filter(p => !fas(p)); if (nf.length) c = nf; }
        return { pid: S.pres, a: { t: 'execute', target: pickOne(c) } };
      }
      break;
  }
  return null;
}
function scheduleBots() {
  if (!ST.isHost || !HOST.G || HOST.botTimer || HOST.G.S.phase !== 'play') return;
  HOST.botTimer = setTimeout(() => {
    HOST.botTimer = null;
    const G = HOST.G; if (!G) return;
    const b = botAction(G);
    if (b) { HOST.q.push(b); pump(); }
    else if (G.S.phase === 'play') scheduleBots();
  }, 1000);
}

    else if (kind === 'H') h += '<p class="small center muted">You don’t know who the Fascists are. Stay hidden!</p>';
    else if (kind === 'L') h += '<p class="small center muted">Find Hitler and pass five Liberal policies.</p>';
  } else h += '<div class="rolecard" data-a="role" style="cursor:pointer;width:min(40vw,150px)">' + backSvg + '</div>';
  return h + '</div>';
}

function renderGame(app) {
  const S = gameS();
  if (!S) { app.innerHTML = logoHtml() + '<div class="card center">Loading game…</div>'; return; }
  let h = '<div class="row" style="margin:8px 0"><h2 class="grow">Secret <span style="color:var(--fas)">Hitler</span></h2><button class="ghost" data-a="rules" style="padding:6px 10px">Rules</button><button class="ghost" data-a="leave" style="padding:6px 10px">Exit</button></div>';
  if (S.phase === 'over') {
    h += '<div class="win ' + S.winner + ' disp">' + (S.winner === 'liberal' ? 'Liberals win!' : 'Fascists win!') + '<div style="font:15px Georgia,serif;text-transform:none;letter-spacing:0;margin-top:4px">' + esc(S.why) + '</div></div>';
    h += '<div class="card"><h2>Secret roles</h2><div class="players" style="margin-top:8px">' + S.seats.map(p => playerChip(p)).join('') + '</div>' + (ST.isHost ? '<button class="pri" style="width:100%;margin-top:12px" data-a="again">Play again (back to lobby)</button>' : '<div class="banner" style="margin-top:10px">Waiting for the host to start another game…</div>') + '</div>';
  } else {
    h += '<div class="banner"><b>' + esc(pname(S.pres)) + '</b> is President' + (S.chan ? ' · <b>' + esc(pname(S.chan)) + '</b> is Chancellor' : '') + (S.special ? ' <span class="muted small">(special election)</span>' : '') + '</div>';
    h += actionPanel(S);
  }
  if (S.phase !== 'over') h += '<div class="card"><h2>Players</h2><div class="players" style="margin-top:8px">' + S.seats.map(p => playerChip(p)).join('') + '</div></div>';
  h += rolePanel(S) + boardsHtml(S);
  if (S.lastVote) h += '<div class="card"><div class="row"><h3 class="grow">Last election</h3><button class="ghost" data-a="showvote" style="padding:4px 10px;font-size:13px">Show votes</button></div><div class="small">' + esc(pname(S.lastVote.pres)) + ' & ' + esc(pname(S.lastVote.chan)) + ' — <b>' + S.lastVote.ja + ' Ja</b> / <b>' + S.lastVote.nein + ' Nein</b> — ' + (S.lastVote.passed ? 'elected' : 'rejected') + '</div></div>';
  h += '<div class="card"><h3>Game log</h3><div class="log">' + S.log.map(l => '<div>' + esc(l) + '</div>').join('') + '</div></div>' + footHtml();
  app.innerHTML = h;
}

function renderOverlay() {
  const o = $('#overlay');
  const S = gameS();
  if (ST.modal === 'vote' && S && S.lastVote) {
    const lv = S.lastVote;
    o.innerHTML = '<div class="modal"><div class="card"><h2 class="center">' + (lv.passed ? 'Government elected' : 'Government rejected') + '</h2><p class="center" style="margin:6px 0">' + esc(pname(lv.pres)) + ' (President) & ' + esc(pname(lv.chan)) + ' (Chancellor)</p><div class="win ' + (lv.passed ? 'liberal' : 'fascist') + ' disp" style="font-size:22px">Ja ' + lv.ja + ' — Nein ' + lv.nein + '</div><div class="vgrid">' +
      S.seats.filter(p => lv.votes[p]).map(p => '<div class="vv ' + lv.votes[p] + '"><span>' + esc(pname(p)) + '</span><b>' + (lv.votes[p] === 'ja' ? 'Ja!' : 'Nein!') + '</b></div>').join('') + '</div><button class="pri" style="width:100%" data-a="closemodal">OK</button></div></div>';
  } else if (ST.modal === 'rules') {
    o.innerHTML = '<div class="modal"><div class="card"><h2>Rules in brief</h2><div class="small" style="margin:8px 0;line-height:1.5">' +
      '<p><b>Teams.</b> Liberals (majority) vs. Fascists + secret Hitler. Fascists know each other; Hitler knows them only in 5–6 player games.</p>' +
      '<p><b>Each round.</b> The President nominates a Chancellor (not last elected government’s Chancellor — and not last President if more than 5 players are alive). Everyone votes Ja/Nein; a majority of Ja elects them. Three failed elections in a row enact the top policy.</p>' +
      '<p><b>Legislative session.</b> President draws 3 policies, discards 1, passes 2. Chancellor enacts 1 and discards the other. No talking while it happens — and lying afterwards is allowed.</p>' +
      '<p><b>Powers.</b> Enacting Fascist policies unlocks powers: Investigate loyalty, Policy peek, Special election, Execution. After 5 Fascist policies the Chancellor may propose a veto.</p>' +
      '<p><b>Liberals win</b> with 5 Liberal policies or by executing Hitler. <b>Fascists win</b> with 6 Fascist policies, or by electing Hitler Chancellor after 3 Fascist policies are in play.</p></div><button class="pri" style="width:100%" data-a="closemodal">Got it</button></div></div>';
  } else if (ST.modal === 'art') {
    o.innerHTML = '<div class="modal"><div class="card"><h2>Artwork</h2><p class="small muted" style="margin:6px 0">Upload the original card images (from the free print-and-play files at secrethitler.com, CC BY-NC-SA 4.0) and everyone will see them instead of the built-in illustrations. Portrait images ~5:7 work best.</p>' +
      SLOTS.map(([k, n]) => '<div class="slotrow">' + (ST.art[k] ? '<img alt="" src="/_blob/' + esc(ST.art[k]) + '">' : '<span style="width:34px"></span>') + '<span class="nm">' + esc(n) + '</span><label class="btn small">Upload<input type="file" accept="image/*" data-slot="' + k + '"></label>' + (ST.art[k] ? '<button class="ghost" style="padding:3px 8px;font-size:12px" data-a="resetart" data-slot="' + k + '">Reset</button>' : '') + '</div>').join('') +
      '<button class="pri" style="width:100%;margin-top:12px" data-a="closemodal">Close</button></div></div>';
  } else o.innerHTML = '';
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, S = gameS();
  switch (a) {
    case 'create': enter('create'); break;
    case 'join': enter('join'); break;
    case 'start': startGame(); break;
    case 'addbot': addBot(); break;
    case 'rmbot': removeBot(); break;
    case 'again': playAgain(); break;
    case 'leave': leaveRoom(); break;
    case 'rules': ST.modal = 'rules'; render(); break;
    case 'art': ST.modal = 'art'; render(); break;
    case 'closemodal': if (ST.modal === 'vote' && S && S.lastVote) ST.seenVote = S.lastVote.id; ST.modal = null; render(); break;
    case 'showvote': if (S && S.lastVote) { ST.modal = 'vote'; render(); } break;
    case 'togglepw': ST.showPw = !ST.showPw; render(); break;
    case 'role': ST.showRole = !ST.showRole; render(); break;
    case 'pick': ST.pick = ST.pick === el.dataset.p ? null : el.dataset.p; render(); break;
    case 'sel': ST.sel = +el.dataset.i; render(); break;
    case 'nominate': case 'investigate': case 'special': case 'execute':
      if (ST.pick) { const t = ST.pick; ST.pick = null; sendAct({ t: a, target: t }); render(); } break;
    case 'vote': sendAct({ t: 'vote', v: el.dataset.v }); toast('Vote sent'); break;
    case 'discard': case 'enact':
      if (ST.sel != null) { const i = ST.sel; ST.sel = null; sendAct({ t: 'discard', i }); render(); } break;
    case 'veto': sendAct({ t: 'veto' }); break;
    case 'vetoyes': sendAct({ t: 'vetoResp', ok: true }); break;
    case 'vetono': sendAct({ t: 'vetoResp', ok: false }); break;
    case 'ack': sendAct({ t: 'ack' }); break;
    case 'resetart': resetArt(el.dataset.slot); break;
  }
  if (ST.modal === 'vote' && S && S.lastVote && a !== 'showvote') { /* keep */ }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t && t.type === 'file' && t.dataset.slot) uploadArt(t.dataset.slot, t.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && ST.view === 'landing' && (e.target.id === 'in-name' || e.target.id === 'in-pw')) enter('join');
});

/* ================= boot ================= */
async function boot() {
  render();
  if (window.__fbReady) await window.__fbReady;
  ST.art = Object.assign({}, (window.SH_CONFIG && window.SH_CONFIG.art) || {});
  if (!window.claude || !window.claude.use) { render(); return; }
  try { DB = await claude.use('db'); } catch (e) { DB = null; }
  try { USER = await claude.use('user'); } catch (e) { USER = null; }
  try { ASSETS = await claude.use('assets'); ST.canArt = !!ASSETS; } catch (e) { ASSETS = null; }
  render();
  if (!DB) return;
  // auto-rejoin after a reload
  try {
    const saved = JSON.parse(lsGet('sh2:last') || 'null');
    if (saved && saved.name && saved.pw) {
      ST.busy = true; render();
      try { await doEnter('join', saved.name, saved.pw); }
      catch (e) { ST.busy = false; ST.err = ''; render(); }
      if (ST.view === 'landing') { ST.busy = false; ST.err = ''; render(); }
    }
  } catch (e) {}
}
boot();
})();
</script>
